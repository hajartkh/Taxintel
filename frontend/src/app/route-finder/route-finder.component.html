<div class="bar">
  <span class="info">{{ i18n.msg(info) }}</span>
  <button type="button" [disabled]="startDisabled" (click)="toggleDrive()">{{ buttonLabel }}</button>
  <label>{{ t('route.speed') }}
    <select [(ngModel)]="speedKmh">
      <option [ngValue]="50">50 km/h</option>
      <option [ngValue]="100">100 km/h</option>
      <option [ngValue]="300">300 km/h {{ t('route.demo') }}</option>
      <option [ngValue]="1000">1000 km/h {{ t('route.demo') }}</option>
      <option [ngValue]="5000">5000 km/h {{ t('rf.noDemo') }}</option>
    </select>
  </label>
  <label><input type="checkbox" [(ngModel)]="follow"> {{ t('route.follow') }}</label>
  <label><input type="checkbox" [(ngModel)]="pinMode"> {{ t('rf.pinMode') }}</label>
  <button type="button" (click)="reset()">{{ t('rf.reset') }}</button>
</div>
<div #mapEl class="map"></div>
