<header class="head">
  <div class="label">{{ year() }}</div>
  <h2>{{ dateLabel() }}</h2>
</header>

<ul class="list">
  @for (e of entries(); track e.key) {
    <li [class]="'entry ' + e.kind">
      <div class="time">{{ e.time || t('calPage.allDay') }}</div>
      <div class="text">
        <div class="title">{{ e.title }}</div>
        @if (e.detail) {
          <div class="detail">{{ e.detail }}</div>
        }
      </div>
      @if (e.level) {
        <app-demand-badge [level]="e.level" />
      }
      @if (e.agendaId; as id) {
        <button type="button" class="delete" [attr.aria-label]="t('calPage.delete', { title: e.title })" [attr.title]="t('calPage.delete', { title: e.title })" (click)="remove.emit(id)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6" />
          </svg>
        </button>
      }
    </li>
  } @empty {
    <li class="empty">{{ t('calPage.nothing') }}</li>
  }
</ul>

<app-agenda-form [date]="day()" (added)="added.emit($event)" />
