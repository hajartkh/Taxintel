<div class="main">
  <section class="driver-bar" aria-label="Driver summary">
    <h1>{{ greeting() }}</h1>
    <dl class="stats">
      <div class="stat"><dt>Today</dt><dd>€{{ driver().earningsToday }}</dd></div>
      <div class="stat"><dt>Trips</dt><dd>{{ driver().tripsToday }}</dd></div>
    </dl>
  </section>

  <app-demand-map class="map" />
</div>

<aside class="panel">
  <div class="panel-scroll">
    <app-city-calendar class="section" />
    <app-smart-route class="section" />
  </div>

  <div class="panel-foot">
    <button class="cta" type="button" [disabled]="!trip.canStart()" (click)="onStart()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 11 19-9-9 19-2-8-8-2Z" />
      </svg>
      {{ startLabel() }}
    </button>
    @if (trip.active()) {
      <button class="end" type="button" title="End trip" aria-label="End trip" (click)="trip.stop()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
      </button>
    }
  </div>
</aside>
