<div class="head">
  <div>
    <h2 class="label">City calendar</h2>
    <div class="sub">{{ dateLabel() }}</div>
  </div>
  <div class="arrows">
    <button type="button" aria-label="Previous day" (click)="store.shiftDay(-1)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
    </button>
    <button type="button" aria-label="Next day" (click)="store.shiftDay(1)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
    </button>
  </div>
</div>

<div class="week">
  @for (day of week(); track day.date.getTime()) {
    <button
      type="button"
      class="day"
      [class.selected]="day.selected"
      [class.today]="day.today"
      [attr.aria-label]="day.ariaLabel"
      [attr.aria-pressed]="day.selected"
      (click)="store.selectDay(day.date)"
    >
      <small>{{ day.weekday }}</small>
      <b>{{ day.dayOfMonth }}</b>
      <span class="dots">
        @for (dot of day.dots; track dot) {
          <i></i>
        }
      </span>
    </button>
  }
</div>

<div class="events">
  @for (item of items(); track item.event.id) {
    <button type="button" class="event" [class.active]="item.active" (click)="select(item.event)">
      <div class="time">
        <b>{{ item.start }}<span>–</span>{{ item.end }}</b>
      </div>
      <div>
        <div class="name">{{ item.event.name }}</div>
        <div class="venue">{{ item.event.venue.name }}</div>
      </div>
      <app-demand-badge [level]="item.level" />
    </button>
  } @empty {
    <div class="empty">
      {{ store.eventsFailed() ? 'Events could not be loaded. Is the backend running?' : 'No major events on this day.' }}
    </div>
  }
</div>
