<div class="legend glass">
  <div class="label">{{ 'legend.title' | t }}</div>
  <div class="grid">
    <span class="key"><span class="swatch high"></span>{{ 'legend.high' | t }}</span>
    <span class="key"><span class="swatch busy"></span>{{ 'legend.busy' | t }}</span>
    <span class="key"><span class="swatch venue"></span>{{ 'legend.venue' | t }}</span>
    <span class="key"><span class="swatch line"></span>{{ 'legend.route' | t }}</span>
  </div>
  <div class="hint">{{ 'legend.hint' | t }}</div>
</div>
