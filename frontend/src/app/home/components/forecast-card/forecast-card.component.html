<div class="card glass">
  <button
    class="tab"
    type="button"
    [attr.aria-expanded]="store.forecastOpen()"
    [title]="(store.forecastOpen() ? 'forecast.hide' : 'forecast.show') | t"
    [attr.aria-label]="'forecast.toggle' | t"
    (click)="toggle()"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
    </svg>
    <span>{{ time() }}</span>
    <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
      <path d="m9 18 6-6-6-6" />
    </svg>
  </button>

  <div class="body" [attr.inert]="store.forecastOpen() ? null : ''">
    <div class="head">
      <span class="label">{{ 'forecast.title' | t }}</span>
      <button class="now" type="button" [class.active]="store.live()" (click)="store.goLive()">{{ 'forecast.now' | t }}</button>
    </div>
    <div class="time">{{ time() }} <span>{{ day() }}</span></div>
    <input type="range" min="0" [max]="maxSlot" step="1" [value]="store.slot()" [attr.aria-label]="'forecast.slider' | t" (input)="onSlide($event)" />
    <div class="ticks"><span>06</span><span>12</span><span>18</span><span>00</span><span>05:30</span></div>
  </div>
</div>
